<!DOCTYPE html>
<html lang="sk">
<head>
  <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Igor Stream - Radio Player & Chromecast</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; max-width: 800px; margin: 0 auto; color: #333; }
        .section { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .controls, .volume-control, .chromecast-control { margin-bottom: 15px; }
        button { padding: 10px 15px; cursor: pointer; border: none; border-radius: 5px; background: #007bff; color: #fff; font-size: 16px; margin-right: 10px; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        input[type="range"] { width: 100%; max-width: 300px; }
        .flags-container { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 10px; }
        .flag-btn { font-size: 30px; cursor: pointer; border: 2px solid transparent; background: none; border-radius: 5px; padding: 5px; transition: 0.2s; }
        .flag-btn:hover, .flag-btn.active { border-color: #007bff; background: #e9ecef; }
        .station-list { list-style: none; padding: 0; max-height: 400px; overflow-y: auto; }
        .station-item { padding: 10px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .station-item:last-child { border-bottom: none; }
        .station-item:hover { background: #f1f1f1; }
        .play-station-btn { background: #28a745; font-size: 14px; padding: 5px 10px; }
        .play-station-btn:hover { background: #218838; }
        google-cast-launcher { width: 40px; height: 40px; cursor: pointer; }
        .header { display: flex; align-items: center; justify-content: space-between; }
        .now-playing { font-weight: bold; color: #007bff; margin-top: 10px; }
    </style>
    <!-- Google Cast SDK -->
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</head>
<body>
    <h1>Igor Stream</h1>

    <!-- Horná polovica - Ovládacie prvky -->
    <div class="section">
        <div class="header">
            <h2>Ovládanie prehrávača</h2>
            <google-cast-launcher></google-cast-launcher> <!-- Výber Chromecastu -->
        </div>

        <div class="chromecast-control">
            <p>Stav Chromecastu: <strong id="cast-status">Odpojené</strong></p>
            <p class="now-playing" id="now-playing-text">Aktuálne nie je vybraná žiadna stanica.</p>
        </div>

        <div class="controls">
            <button id="btn-play" disabled>▶ Zapnúť stream</button>
            <button id="btn-stop" disabled>■ Vypnúť stream</button>
        </div>

        <div class="volume-control">
            <label for="volume-slider">Hlasitosť Chromecastu:</label><br>
            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5" disabled>
        </div>
    </div>

    <!-- Dolná polovica - Výber rádia podľa krajiny -->
    <div class="section">
        <h2>Výber stanice podľa krajiny</h2>
        <p>Zvoľte krajinu pre načítanie zoznamu rádií.</p>
        <div class="flags-container" id="flags-container">
            <!-- Vlajky (SK, CZ, US, GB atd.) sa vygenerujú cez JS -->
        </div>
    </div>

    <!-- Zoznam staníc -->
    <div class="section">
        <h2>Dostupné stanice</h2>
        <ul class="station-list" id="station-list">
            <li class="station-item">Vyberte krajinu pomocou vlajky.</li>
        </ul>
    </div>

    <script>
        // Nastavenie vlajok podla poziadavky (SK a CZ prvé)
        const flags = [
            { code: 'SK', emoji: '🇸🇰', name: 'Slovensko' },
            { code: 'CZ', emoji: '🇨🇿', name: 'Česko' },
            { code: 'US', emoji: '🇺🇸', name: 'USA' },
            { code: 'GB', emoji: '🇬🇧', name: 'Veľká Británia' },
            { code: 'DE', emoji: '🇩🇪', name: 'Nemecko' },
            { code: 'AT', emoji: '🇦🇹', name: 'Rakúsko' },
            { code: 'PL', emoji: '🇵🇱', name: 'Poľsko' }
        ];

        let currentStreamUrl = null;
        let currentStationName = null;
        let castSession = null;

        // --- Cast Initialization ---
        window['__onGCastApiAvailable'] = function(isAvailable) {
            if (isAvailable) {
                cast.framework.CastContext.getInstance().setOptions({
                    receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
                    autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
                });

                const context = cast.framework.CastContext.getInstance();
                context.addEventListener(
                    cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
                    function(event) {
                        switch (event.sessionState) {
                            case cast.framework.SessionState.SESSION_STARTED:
                            case cast.framework.SessionState.SESSION_RESUMED:
                                castSession = context.getCurrentSession();
                                document.getElementById('cast-status').innerText = 'Pripojené (' + castSession.getCastDevice().friendlyName + ')';
                                document.getElementById('volume-slider').disabled = false;
                                updatePlaybackControls();
                                break;
                            case cast.framework.SessionState.SESSION_ENDED:
                                castSession = null;
                                document.getElementById('cast-status').innerText = 'Odpojené';
                                document.getElementById('volume-slider').disabled = true;
                                document.getElementById('btn-play').disabled = true;
                                document.getElementById('btn-stop').disabled = true;
                                break;
                        }
                    }
                );
            }
        };

        // --- Prehrávanie a Ovládanie ---
        document.getElementById('btn-play').addEventListener('click', playStream);
        document.getElementById('btn-stop').addEventListener('click', stopStream);
        
        document.getElementById('volume-slider').addEventListener('input', function() {
            if (castSession) {
                castSession.setVolume(parseFloat(this.value));
            }
        });

        function updatePlaybackControls() {
            if (castSession && currentStreamUrl) {
                document.getElementById('btn-play').disabled = false;
                document.getElementById('btn-stop').disabled = false;
            } else {
                document.getElementById('btn-play').disabled = true;
                document.getElementById('btn-stop').disabled = true;
            }
        }

        function setLocalStream(url, name) {
            currentStreamUrl = url;
            currentStationName = name;
            document.getElementById('now-playing-text').innerText = `Vybraná stanica: ${name}`;
            updatePlaybackControls();
            
            if (castSession) {
                playStream();
            } else {
                alert(`Stanica ${name} bola vybraná. Pre prehrávanie sa prosím pripojte ku Chromecastu (ikona vpravo hore).`);
            }
        }

        function playStream() {
            if (!castSession || !currentStreamUrl) return;
            
            var mediaInfo = new chrome.cast.media.MediaInfo(currentStreamUrl, 'audio/mpeg');
            mediaInfo.metadata = new chrome.cast.media.GenericMediaMetadata();
            mediaInfo.metadata.metadataType = chrome.cast.media.MetadataType.GENERIC;
            mediaInfo.metadata.title = currentStationName;
            
            var request = new chrome.cast.media.LoadRequest(mediaInfo);
            castSession.loadMedia(request).then(
                function() { console.log('Načítanie úspešné'); },
                function(errorCode) { console.log('Chyba načítania médií: ' + errorCode); }
            );
        }

        function stopStream() {
            if (!castSession) return;
            const mediaSession = castSession.getMediaSession();
            if (mediaSession) {
                mediaSession.stop(null,
                    () => console.log("Stream zastavený"),
                    (err) => console.error(err)
                );
            }
        }

        // --- Radio Browser API (Zoznam rádií podľa krajiny) ---
        const flagsContainer = document.getElementById('flags-container');
        const stationList = document.getElementById('station-list');

        flags.forEach(country => {
            const btn = document.createElement('button');
            btn.className = 'flag-btn';
            btn.innerHTML = country.emoji;
            btn.title = country.name;
            btn.onclick = () => loadStations(country.code, btn);
            flagsContainer.appendChild(btn);
        });

        async function loadStations(countryCode, btnElement) {
            // Zvýraznenie aktívnej vlajky
            document.querySelectorAll('.flag-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            stationList.innerHTML = '<li class="station-item">Načítavam stanice...</li>';

            try {
                // Fetch dát z Radio-Browser API (zoradené podľa obľúbenosti)
                const response = await fetch(`https://de1.api.radio-browser.info/json/stations/bycountrycodeexact/${countryCode}?limit=50&order=clickcount&hidebroken=true`);
                const data = await response.json();
                
                stationList.innerHTML = '';
                if(data.length === 0) {
                    stationList.innerHTML = '<li class="station-item">Žiadne stanice neboli nájdené.</li>';
                    return;
                }

                data.forEach(station => {
                    const li = document.createElement('li');
                    li.className = 'station-item';
                    
                    const span = document.createElement('span');
                    span.innerText = station.name || 'Neznáma stanica';
                    
                    const playBtn = document.createElement('button');
                    playBtn.className = 'play-station-btn';
                    playBtn.innerText = 'Vybrať';
                    playBtn.onclick = () => setLocalStream(station.url_resolved || station.url, station.name);
                    
                    li.appendChild(span);
                    li.appendChild(playBtn);
                    stationList.appendChild(li);
                });
            } catch (error) {
                console.error("Chyba API:", error);
                stationList.innerHTML = '<li class="station-item" style="color:red;">Chyba pri načítaní staníc. Skúste znova.</li>';
            }
        }
    </script>
</body>
</html>
