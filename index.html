<!doctype html>
<html lang="sk">
<head>
<link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Igor Stream - Mobilný Audio Player</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1e29;
            --accent-color: #00e5ff;
            --accent-glow: rgba(0, 229, 255, 0.3);
            --text-main: #ffffff;
            --text-muted: #8c92a4;
            --success: #00e676;
            --danger: #ff5252;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.05);
        }

        h1 {
            font-size: 1.25rem;
            text-align: center;
            margin-bottom: 16px;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        /* Displej */
        .display-panel {
            background: #11141d;
            border-radius: 16px;
            padding: 18px;
            text-align: center;
            border: 1px solid rgba(0, 229, 255, 0.15);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }

        .display-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
        }

        .now-playing-label {
            font-size: 0.75rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .track-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-meta {
            display: flex;
            justify-content: center;
            gap: 12px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .bitrate-badge {
            background: rgba(255,255,255,0.08);
            padding: 2px 8px;
            border-radius: 6px;
            color: var(--accent-color);
            font-weight: 600;
        }

        /* Ekvalizér */
        .equalizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 4px;
            height: 22px;
            margin-top: 12px;
        }

        .bar {
            width: 4px;
            background: var(--accent-color);
            border-radius: 2px;
            height: 4px;
            transition: height 0.2s ease;
        }

        .playing .bar {
            animation: equalize 0.8s infinite ease-in-out alternate;
        }

        .playing .bar:nth-child(1) { animation-delay: 0.1s; }
        .playing .bar:nth-child(2) { animation-delay: 0.3s; }
        .playing .bar:nth-child(3) { animation-delay: 0.2s; }
        .playing .bar:nth-child(4) { animation-delay: 0.5s; }
        .playing .bar:nth-child(5) { animation-delay: 0.25s; }

        @keyframes equalize {
            0% { height: 4px; }
            100% { height: 20px; }
        }

        /* Ovládacie prvky */
        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #12151e;
            padding: 10px 14px;
            border-radius: 12px;
        }

        .volume-container span { font-size: 0.85rem; color: var(--text-muted); }

        input[type="range"] {
            flex: 1;
            accent-color: var(--accent-color);
            cursor: pointer;
            height: 6px;
            border-radius: 3px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            background: #252a3a;
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 12px;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn:hover { background: #2f3548; border-color: var(--accent-color); }
        
        .btn-primary {
            background: var(--accent-color);
            color: #000;
            border: none;
        }
        .btn-primary:hover { background: #00b8d4; }

        /* Zoznam streamov */
        .streams-section h2 {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .streams-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 260px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .streams-list::-webkit-scrollbar { width: 4px; }
        .streams-list::-webkit-scrollbar-thumb { background: #2f3548; border-radius: 2px; }

        .stream-card {
            background: #131620;
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s;
        }

        .stream-card:hover { background: #181c29; }
        .stream-card.active {
            border-color: var(--accent-color);
            background: rgba(0, 229, 255, 0.05);
        }

        .stream-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            overflow: hidden;
        }

        .health-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            flex-shrink: 0;
        }
        .health-indicator.ok { background: var(--success); box-shadow: 0 0 6px var(--success); }
        .health-indicator.error { background: var(--danger); }

        .stream-name {
            font-size: 0.95rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stream-meta-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stream-bitrate {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: rgba(255,255,255,0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }

        #audioElement { display: none; }
    </style>

    <!-- Google Cast SDK -->
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</head>
<body>

    <div class="app-container">
        <h1>Igor Stream</h1>

        <!-- Horný displej -->
        <div id="displayPanel" class="display-panel">
            <div class="now-playing-label">Práve hraje</div>
            <div id="displayTitle" class="track-title">Žiadny stream nevybratý</div>
            <div class="track-meta">
                <span id="displayStatus">Pripravené</span>
                <span id="displayBitrate" class="bitrate-badge">-</span>
            </div>
            <div id="equalizer" class="equalizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>

        <!-- Ovládacie prvky -->
        <div class="controls-panel">
            <div class="volume-container">
                <span>🔊</span>
                <input type="range" id="volumeRange" min="0" max="1" step="0.05" value="1">
            </div>
            <div class="action-buttons">
                <button id="castBtn" class="btn" onclick="toggleCastSession()">
                    <span>📺</span> <span id="castLabel">Chromecast</span>
                </button>
                <button id="playBtn" class="btn btn-primary" onclick="togglePlayPause()">
                    <span id="playIcon">▶</span> <span id="playText">Prehrať</span>
                </button>
            </div>
        </div>

        <!-- Zoznam streamov -->
        <div class="streams-section">
            <h2>Slovenské rádiá & Streamy</h2>
            <div id="streamsList" class="streams-list">
                <!-- Dynamicky generované -->
            </div>
        </div>
    </div>

    <audio id="audioElement" crossorigin="anonymous"></audio>

    <script>
        // Databáza slovenských rádií s vysokou kvalitou (256, 192, 128 kbps) a záložnými linkami
        const streams = [
            {
                name: "Rádio Slovensko",
                bitrate: "256 kbps",
                urls: [
                    "https://n06.rcs.revma.com/g8hh72e3t1quv?njts=1710000000",
                    "https://icecast.stvr.sk/Slovensko-128.mp3"
                ]
            },
            {
                name: "Rádio_FM",
                bitrate: "256 kbps",
                urls: [
                    "https://n04.rcs.revma.com/y35522e3t1quv",
                    "https://icecast.stvr.sk/FM-128.mp3"
                ]
            },
            {
                name: "Rádio Expres",
                bitrate: "192 kbps",
                urls: [
                    "https://stream.express.sk/express-192.mp3",
                    "https://stream.express.sk/express-128.mp3"
                ]
            },
            {
                name: "Fun Radio",
                bitrate: "192 kbps",
                urls: [
                    "https://live.funradio.sk:8000/fun192.mp3",
                    "https://live.funradio.sk:8000/fun128.mp3"
                ]
            },
            {
                name: "Rádio Jemné",
                bitrate: "128 kbps",
                urls: [
                    "https://stream.jemne.sk/jemne128.mp3"
                ]
            },
            {
                name: "Rádio Vlna",
                bitrate: "128 kbps",
                urls: [
                    "https://stream.radiovlna.sk/vlna128.mp3"
                ]
            }
        ];

        let currentStreamIndex = parseInt(localStorage.getItem('igor_last_stream')) || 0;
        let currentUrlIndex = 0;
        let isPlaying = false;
        let castDeviceName = localStorage.getItem('igor_last_cast_name') || "Chromecast";

        const audioElement = document.getElementById('audioElement');
        const displayTitle = document.getElementById('displayTitle');
        const displayStatus = document.getElementById('displayStatus');
        const displayBitrate = document.getElementById('displayBitrate');
        const displayPanel = document.getElementById('displayPanel');
        const playIcon = document.getElementById('playIcon');
        const playText = document.getElementById('playText');
        const volumeRange = document.getElementById('volumeRange');
        const castLabel = document.getElementById('castLabel');

        // Inicializácia Google Cast API
        window['__onGCastApiAvailable'] = function(isAvailable) {
            if (isAvailable) {
                initializeCastContext();
            }
        };

        function initializeCastContext() {
            const castContext = cast.framework.CastContext.getInstance();
            castContext.setOptions({
                receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
                autoJoinPolicy: chrome.cast.AutoJoinPolicy.TAB_AND_ORIGIN_SCOPED
            });

            castContext.addEventListener(
                cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
                (event) => {
                    const session = castContext.getCurrentSession();
                    if (session) {
                        castDeviceName = session.getCastDevice().friendlyName || "Pripojené";
                        castLabel.textContent = castDeviceName;
                        localStorage.setItem('igor_last_cast_name', castDeviceName);
                        // Ak beží lokálne prehrávanie, môžeme ho zastaviť a poslať na Chromecast
                        if (isPlaying) {
                            sendToCast();
                        }
                    } else {
                        castLabel.textContent = "Chromecast";
                    }
                }
            );
            
            const session = castContext.getCurrentSession();
            if (session) {
                castDeviceName = session.getCastDevice().friendlyName || "Chromecast";
                castLabel.textContent = castDeviceName;
            }
        }

        // Vykreslenie zoznamu streamov
        function renderStreams() {
            const container = document.getElementById('streamsList');
            container.innerHTML = '';

            streams.forEach((stream, index) => {
                const card = document.createElement('div');
                card.className = `stream-card ${index === currentStreamIndex ? 'active' : ''}`;
                card.onclick = () => selectStream(index);
                card.innerHTML = `
                    <div class="stream-info">
                        <div id="health-${index}" class="health-indicator" title="Testujem..."></div>
                        <div class="stream-name">${stream.name}</div>
                    </div>
                    <div class="stream-meta-right">
                        <span class="stream-bitrate">${stream.bitrate}</span>
                    </div>
                `;
                container.appendChild(card);
                checkStreamHealth(index, stream.urls[0]);
            });
        }

        // Test dostupnosti streamu
        async function checkStreamHealth(index, url) {
            const indicator = document.getElementById(`health-${index}`);
            if (!indicator) return;
            try {
                // Použijeme fetch s mode no-cors na overenie dostupnosti koncového bodu
                await fetch(url, { method: 'HEAD', mode: 'no-cors', cache: 'no-cache' });
                indicator.className = 'health-indicator ok';
                indicator.title = 'Stream je dostupný';
            } catch (e) {
                indicator.className = 'health-indicator error';
                indicator.title = 'Stream môže byť blokovaný alebo offline';
            }
        }

        // Výber streamu
        function selectStream(index) {
            currentStreamIndex = index;
            currentUrlIndex = 0;
            localStorage.setItem('igor_last_stream', index);
            
            // Aktualizácia aktívnej triedy v UI
            document.querySelectorAll('.stream-card').forEach((card, idx) => {
                if (idx === index) card.classList.add('active');
                else card.classList.remove('active');
            });

            const stream = streams[currentStreamIndex];
            displayTitle.textContent = stream.name;
            displayBitrate.textContent = stream.bitrate;

            if (isPlaying) {
                playCurrentStream();
            }
        }

        // Spustenie / zastavenie prehrávania
        function togglePlayPause() {
            const stream = streams[currentStreamIndex];
            const castContext = cast.framework.CastContext ? cast.framework.CastContext.getInstance() : null;
            const session = castContext ? castContext.getCurrentSession() : null;

            if (isPlaying) {
                if (session) {
                    session.endSession(true);
                }
                audioElement.pause();
                setPlayingState(false);
            } else {
                if (session) {
                    sendToCast();
                } else {
                    playCurrentStream();
                }
            }
        }

        function playCurrentStream() {
            const stream = streams[currentStreamIndex];
            const url = stream.urls[currentUrlIndex];
            
            audioElement.src = url;
            audioElement.play().then(() => {
                setPlayingState(true);
                displayStatus.textContent = "Prehráva sa";
            }).catch(error => {
                console.warn(`Link ${url} zlyhal, skúšam alternatívny...`);
                if (currentUrlIndex < stream.urls.length - 1) {
                    currentUrlIndex++;
                    playCurrentStream();
                } else {
                    displayStatus.textContent = "Chyba prehrávania";
                    setPlayingState(false);
                }
            });
        }

        async function sendToCast() {
            const stream = streams[currentStreamIndex];
            const url = stream.urls[currentUrlIndex];
            const castContext = cast.framework.CastContext.getInstance();
            let session = castContext.getCurrentSession();

            try {
                if (!session) {
                    await castContext.requestSession();
                    session = castContext.getCurrentSession();
                }

                if (session) {
                    const mediaInfo = new chrome.cast.media.MediaInfo(url, 'audio/mp3');
                    mediaInfo.metadata = new chrome.cast.media.GenericMediaMetadata();
                    mediaInfo.metadata.title = stream.name;
                    mediaInfo.metadata.subtitle = `Bitrate: ${stream.bitrate}`;

                    const request = new chrome.cast.media.LoadRequest(mediaInfo);
                    request.autoplay = true;

                    await session.loadMedia(request);
                    setPlayingState(true);
                    displayStatus.textContent = "Casting na " + castDeviceName;
                    audioElement.pause(); // Zastavenie lokálneho ak ide do Chromecastu
                }
            } catch (err) {
                console.error("Cast chyba:", err);
                displayStatus.textContent = "Cast zlyhal";
            }
        }

        async function toggleCastSession() {
            const castContext = cast.framework.CastContext.getInstance();
            try {
                await castContext.requestSession();
            } catch (e) {
                console.error("Nepodarilo sa vyvolať Chromecast dialóg:", e);
            }
        }

        function setPlayingState(playing) {
            isPlaying = playing;
            if (playing) {
                playIcon.textContent = "⏸";
                playText.textContent = "Zastaviť";
                displayPanel.classList.add('playing');
                displayStatus.textContent = "Prehráva sa";
            } else {
                playIcon.textContent = "▶";
                playText.textContent = "Prehrať";
                displayPanel.classList.remove('playing');
                displayStatus.textContent = "Zastavené";
            }
        }

        // Ovládanie hlasitosti
        volumeRange.oninput = (e) => {
            audioElement.volume = e.target.value;
            const castContext = cast.framework.CastContext ? cast.framework.CastContext.getInstance() : null;
            const session = castContext ? castContext.getCurrentSession() : null;
            if (session) {
                session.setVolume(parseFloat(e.target.value));
            }
        };

        // Inicializácia pri naštartovaní
        window.onload = () => {
            renderStreams();
            const defaultStream = streams[currentStreamIndex];
            displayTitle.textContent = defaultStream.name;
            displayBitrate.textContent = defaultStream.bitrate;
            audioElement.volume = volumeRange.value;
            if (localStorage.getItem('igor_last_cast_name')) {
                castLabel.textContent = localStorage.getItem('igor_last_cast_name');
            }
        };
    </script>
</body>
</html>
